      <stop offset="1" stop-color="#eafffb"/>
    </linearGradient>
  </defs>
  <!-- Скруглённый квадрат-«карточка» с фирменным teal-градиентом -->
  <rect x="0" y="0" width="32" height="32" rx="7.5" fill="url(#pmBg)"/>
