<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <h1>PM Assistant</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="capture" aria-selected="true">📝 Захватить</button>
      <button class="tab" role="tab" data-tab="board" aria-selected="false">📋 Задачи и темы</button>
      <button class="tab" role="tab" data-tab="search" aria-selected="false">🔍 Найти</button>
    </nav>
    <div class="topbar-actions">
      <button id="theme-toggle" class="icon-btn" title="Переключить тему" aria-label="Переключить тему">☾</button>
      <button id="settings-btn" class="icon-btn" title="Настройки" aria-label="Настройки">⚙</button>
    </div>
  </header>

  <main class="content">
    <!-- ВКЛАДКА 1: ЗАХВАТИТЬ -->
    <section id="view-capture" class="view view-capture" data-view="capture">
      <textarea
        id="capture-input"
        class="capture-input"
        placeholder="Напишите что угодно: задачу, тему для обсуждения с коллегой, заметку...
Например: «Обсудить с Наташей приоритизацию бэклога на следующий квартал, это важно сделать до пятницы» или «Написать регламент ревью спецификаций, срок — конец месяца»"
      ></textarea>
      <div class="capture-actions">
        <span class="hint">⌘/Ctrl + Enter — обработать</span>
        <button id="parse-btn" class="btn btn-primary">Обработать</button>
      </div>
      <div id="capture-status" class="status-line" hidden></div>
      <div id="capture-result" class="capture-result"></div>
    </section>

    <!-- ВКЛАДКА 2: ЗАДАЧИ И ТЕМЫ -->
    <section id="view-board" class="view" data-view="board" hidden>
      <div class="filters-panel">
        <div class="filter-group">
          <label for="filter-person">Человек</label>
          <select id="filter-person" class="select"><option value="">Все</option></select>
        </div>
        <div class="filter-group">
          <label for="filter-project">Проект</label>
          <select id="filter-project" class="select"><option value="">Все</option></select>
        </div>
        <div class="filter-group">
          <label for="filter-priority">Приоритет</label>
          <select id="filter-priority" class="select">
            <option value="">Все</option>
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="P3">P3</option>
            <option value="P4">P4</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-status">Статус</label>
          <select id="filter-status" class="select">
            <option value="active">Активные</option>
            <option value="done">Закрытые</option>
            <option value="all">Все</option>
          </select>
        </div>
        <div class="filter-group sort-group">
          <label>Сортировка</label>
          <div class="sort-toggles" id="sort-toggles">
            <button class="chip is-active" data-sort="default">по умолчанию</button>
            <button class="chip" data-sort="deadline">по сроку</button>
            <button class="chip" data-sort="priority">по приоритету</button>
            <button class="chip" data-sort="person">по человеку</button>
            <button class="chip" data-sort="project">по проекту</button>
          </div>
        </div>
        <button id="filter-reset" class="btn btn-ghost">Сбросить</button>
      </div>

      <div class="board">
        <div class="column">
          <div class="column-head"><span>💬 Темы для обсуждения</span><span class="count" id="count-topics">0</span></div>
          <ul id="col-topics" class="card-list"></ul>
        </div>
        <div class="column">
          <div class="column-head"><span>✅ Мои задачи</span><span class="count" id="count-tasks">0</span></div>
          <ul id="col-tasks" class="card-list"></ul>
        </div>
        <div class="column">
          <div class="column-head"><span>🗒 Заметки</span><span class="count" id="count-notes">0</span></div>
          <ul id="col-notes" class="card-list"></ul>
        </div>
      </div>
    </section>

    <!-- ВКЛАДКА 3: НАЙТИ -->
    <section id="view-search" class="view" data-view="search" hidden>
      <div class="panel">
        <div class="find-bar">
          <input id="search-input" class="find-input" type="text" placeholder="Спросите свободным текстом…" />
          <button id="search-btn" class="btn btn-primary">Найти</button>
        </div>
        <div class="find-suggestions">
          <button class="chip suggestion">Найди темы для Наташи Ивановой</button>
          <button class="chip suggestion">Покажи задачи по проекту X</button>
          <button class="chip suggestion">Что срочного на этой неделе?</button>
          <button class="chip suggestion">Все задачи связанные с редизайном</button>
        </div>
      </div>
      <div id="search-status" class="status-line" hidden></div>
      <div id="search-answer" class="answer" hidden></div>
      <ul id="search-results" class="card-list"></ul>
    </section>
  </main>

  <!-- Модалка настроек -->
  <div id="settings-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>Настройки</h2>
        <button id="settings-close" class="icon-btn" aria-label="Закрыть">✕</button>
      </div>
      <label class="field-label" for="api-key-input">Claude API ключ</label>
      <input id="api-key-input" class="text-input" type="password" placeholder="sk-ant-..." autocomplete="off" />
      <p class="hint">Хранится только в этом браузере (localStorage) и шлётся напрямую в api.anthropic.com.</p>

      <label class="field-label" for="model-input">Модель</label>
      <input id="model-input" class="text-input" type="text" placeholder="claude-3-5-haiku-20241022" />

      <div class="modal-footer">
        <button id="export-btn" class="btn btn-ghost">Экспорт данных</button>
        <button id="settings-save" class="btn btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
